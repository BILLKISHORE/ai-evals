[tool.poetry]
name = "ai-blackteam"
version = "1.9.0"
description = "Automated LLM red team framework -- test any model's safety with one command"
authors = ["Bill Kishore <abillkishoreinico@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "ai_blackteam", from = "src"}]
keywords = ["llm", "red-team", "security", "jailbreak", "ai-safety", "penetration-testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.poetry.urls]
Homepage = "https://ai-blackteam.ai-evals.workers.dev"
Documentation = "https://ai-blackteam.ai-evals.workers.dev"
Repository = "https://github.com/BILLKISHORE/ai-evals"
"Bug Tracker" = "https://github.com/BILLKISHORE/ai-evals/issues"

[tool.poetry.scripts]
ai-blackteam = "ai_blackteam.cli:cli"

[tool.poetry.dependencies]
python = "^3.12"
click = "^8.1"
pyyaml = "^6.0"
rich = "^13.0"
anthropic = "^1.6"
ollama = "^0.4"
httpx = "^0.28"
openai = "^3.14"
google-genai = "^2.24"
jinja2 = "^3.1"
huggingface-hub = "^1.32"
boto3 = {version = "^1.35", optional = true}
pillow = {version = "^12.0", optional = true}

[tool.poetry.extras]
bedrock = ["boto3"]
multimodal = ["pillow"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^7.0"

[tool.pytest.ini_options]
markers = [
    "live: marks tests that hit real provider APIs (deselect with '-m \"not live\"')",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
