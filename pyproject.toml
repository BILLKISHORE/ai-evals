[tool.poetry]
name = "ai-blackteam"
version = "0.8.0"
description = "Automated LLM red team framework -- test any model's safety with one command"
authors = ["Bill Kishore <abillkishoreinico@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "blackteam", from = "src"}]
keywords = ["llm", "red-team", "security", "jailbreak", "ai-safety", "penetration-testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.poetry.urls]
Homepage = "https://github.com/BILLKISHORE/ai-evals"
Repository = "https://github.com/BILLKISHORE/ai-evals"
"Bug Tracker" = "https://github.com/BILLKISHORE/ai-evals/issues"

[tool.poetry.scripts]
blackteam = "blackteam.cli:cli"

[tool.poetry.dependencies]
python = "^3.12"
click = "^8.1"
pyyaml = "^6.0"
rich = "^13.0"
anthropic = "^0.86"
ollama = "^0.4"
httpx = "^0.27"
openai = "^1.60"
google-genai = "^1.0"
jinja2 = "^3.1"
huggingface-hub = "^0.20"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
