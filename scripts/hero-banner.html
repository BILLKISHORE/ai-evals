<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #0e0b0d;
    --accent: #e63946;
    --accent-deep: #a4161a;
    --scope: #ff6b6b;
    --ink: #f5f0f0;
    --muted: #b9a9ab;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 480px; overflow: hidden; }
  .stage {
    position: relative; width: 1280px; height: 480px;
    background:
      radial-gradient(680px 520px at 50% 44%, rgba(230, 57, 70, 0.20), transparent 62%),
      radial-gradient(900px 700px at 50% 120%, rgba(164, 22, 26, 0.28), transparent 60%),
      var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: var(--sans);
  }
  /* faint grid, fading out toward the edges */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(720px 520px at 50% 46%, #000 20%, transparent 78%);
  }
  .scope-wrap {
    position: relative; width: 220px; height: 220px;
    margin-bottom: 26px;
    filter: drop-shadow(0 0 28px rgba(230, 57, 70, 0.55));
  }
  .scope { width: 220px; height: 220px; }
  .wordmark {
    font-family: var(--mono);
    font-size: 74px; font-weight: 700; letter-spacing: -2px;
    line-height: 1;
  }
  .wordmark .dim { color: var(--ink); }
  .wordmark .hot { color: var(--accent); }
  .tagline {
    margin-top: 20px;
    font-size: 23px; font-weight: 500; color: var(--muted);
    letter-spacing: 0.2px;
  }
  .eyebrow {
    position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
    font-family: var(--mono); font-size: 15px; letter-spacing: 5px;
    color: var(--accent); text-transform: uppercase;
    display: flex; align-items: center; gap: 12px;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="grid"></div>
    <div class="eyebrow">LLM RED TEAM FRAMEWORK</div>
    <div class="scope-wrap">
      <svg class="scope" viewBox="0 0 200 200" fill="none" aria-hidden="true">
        <g stroke="var(--scope)" stroke-linecap="round">
          <circle cx="100" cy="100" r="88" stroke-width="3"/>
          <circle cx="100" cy="100" r="58" stroke-width="2.4"/>
          <circle cx="100" cy="100" r="30" stroke-width="2"/>
          <line x1="100" y1="2" x2="100" y2="34" stroke-width="3"/>
          <line x1="100" y1="166" x2="100" y2="198" stroke-width="3"/>
          <line x1="2" y1="100" x2="34" y2="100" stroke-width="3"/>
          <line x1="166" y1="100" x2="198" y2="100" stroke-width="3"/>
        </g>
        <circle cx="100" cy="100" r="6" fill="var(--scope)"/>
      </svg>
    </div>
    <div class="wordmark"><span class="dim">ai-</span><span class="hot">blackteam</span></div>
    <div class="tagline">Test any model's safety with a single command.</div>
  </div>
</body>
</html>
