<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: #0e0b0d;
    --accent: #e63946;
    --accent-soft: #ff6b6b;
    --accent-deep: #a4161a;
    --text: #f5f3f4;
    --muted: #b9a9ac;
    --line: rgba(255, 107, 107, 0.18);
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    background:
      radial-gradient(900px 600px at 88% 18%, rgba(164, 22, 26, 0.55), transparent 60%),
      radial-gradient(700px 500px at 10% 110%, rgba(230, 57, 70, 0.20), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: var(--sans);
    padding: 76px 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  /* faint scanline grid for texture */
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255, 107, 107, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 107, 107, 0.04) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(1000px 700px at 30% 40%, #000 30%, transparent 80%);
  }
  /* oversized target motif, echoing the logo, bleeding off the right edge */
  .scope {
    position: absolute;
    right: -120px;
    top: 50%;
    transform: translateY(-50%);
    width: 620px;
    height: 620px;
    opacity: 0.5;
  }
  .content { position: relative; z-index: 2; }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-family: var(--mono);
    font-size: 19px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--accent-soft);
    font-weight: 600;
  }
  .eyebrow .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 16px var(--accent); }
  .wordmark {
    font-family: var(--mono);
    font-size: 118px;
    font-weight: 700;
    line-height: 1.0;
    letter-spacing: -0.02em;
    margin-top: 30px;
    color: var(--text);
  }
  .wordmark .accent { color: var(--accent-soft); }
  .tagline {
    font-size: 40px;
    font-weight: 500;
    line-height: 1.25;
    color: var(--muted);
    margin-top: 26px;
    max-width: 760px;
    text-wrap: balance;
  }
  .stats {
    position: relative;
    z-index: 2;
    display: flex;
    flex-wrap: wrap;
    gap: 14px 14px;
    margin-top: 8px;
  }
  .chip {
    font-family: var(--mono);
    font-size: 24px;
    font-weight: 600;
    color: var(--text);
    padding: 14px 22px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.03);
  }
  .chip b { color: var(--accent-soft); font-weight: 700; }
  .footer {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 25px;
    color: var(--muted);
    border-top: 1px solid var(--line);
    padding-top: 26px;
  }
  .footer .url { color: var(--text); font-weight: 600; }
  .footer .install b { color: var(--accent-soft); }
</style>
</head>
<body>
  <div class="card">
    <svg class="scope" viewBox="0 0 200 200" fill="none" aria-hidden="true">
      <g stroke="#ff6b6b" stroke-linecap="round">
        <circle cx="100" cy="100" r="88" stroke-width="3"/>
        <circle cx="100" cy="100" r="58" stroke-width="2.4"/>
        <circle cx="100" cy="100" r="30" stroke-width="2"/>
        <line x1="100" y1="2" x2="100" y2="34" stroke-width="3"/>
        <line x1="100" y1="166" x2="100" y2="198" stroke-width="3"/>
        <line x1="2" y1="100" x2="34" y2="100" stroke-width="3"/>
        <line x1="166" y1="100" x2="198" y2="100" stroke-width="3"/>
      </g>
      <circle cx="100" cy="100" r="6" fill="#ff6b6b"/>
    </svg>

    <div class="content">
      <div class="eyebrow"><span class="dot"></span>Open source · MIT · PyPI</div>
      <div class="wordmark">ai-<span class="accent">blackteam</span></div>
      <div class="tagline">Red-team any LLM's safety from a single command.</div>
    </div>

    <div class="stats">
      <div class="chip"><b>1,020</b> attacks</div>
      <div class="chip"><b>163M</b> attack surface</div>
      <div class="chip"><b>17</b> providers</div>
      <div class="chip"><b>9</b> safety standards</div>
    </div>

    <div class="footer">
      <div class="install">$ <b>pip install ai-blackteam</b></div>
      <div class="url">ai-blackteam.ai-evals.workers.dev</div>
    </div>
  </div>
</body>
</html>
